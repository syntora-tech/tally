name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  database-and-e2e:
    name: DB tests and Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm sb start -x studio,imgproxy,vector,logflare,realtime,storage-api,edge-runtime,supavisor
      - name: Reset database (migrations + seed)
        run: pnpm db:reset
      - name: pgTAP
        run: pnpm db:test
      - name: Integration tests (withUser, RLS, audit, auth services)
        run: pnpm test:int

      - name: Prepare app env from the local stack
        run: pnpm env:local
      - name: Install Playwright browser
        run: pnpm --filter @tally/web exec playwright install --with-deps --only-shell chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
      - name: Playwright
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: pnpm db:stop
