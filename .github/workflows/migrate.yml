name: Migrate

# Applies supabase/migrations to cloud projects (spec 10.5). Migrations must stay backward compatible
# (expand → migrate → contract): Vercel deploys the same commit in parallel via Git integration.
on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/**
      - .github/workflows/migrate.yml
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [preview, production]
        default: preview

concurrency:
  group: migrate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: db push (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        # Manual runs target one environment; pushes go preview first, then production.
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.environment)) || fromJSON('["preview","production"]') }}
    environment: ${{ matrix.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check environment is configured
        id: configured
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::${{ matrix.environment }} is not configured (SUPABASE_PROJECT_REF / SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD); skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.configured.outputs.ok == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.configured.outputs.ok == 'true'
      - uses: actions/setup-node@v5
        if: steps.configured.outputs.ok == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.configured.outputs.ok == 'true'
      - name: Link project
        if: steps.configured.outputs.ok == 'true'
        run: pnpm sb link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Pending migrations
        if: steps.configured.outputs.ok == 'true'
        run: pnpm sb migration list --password "$SUPABASE_DB_PASSWORD"
      - name: Push migrations
        if: steps.configured.outputs.ok == 'true'
        run: pnpm sb db push --password "$SUPABASE_DB_PASSWORD"
